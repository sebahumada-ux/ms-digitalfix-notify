services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: digitalfix-rabbitmq-local

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: digitalfix
      RABBITMQ_DEFAULT_PASS: digitalfix123

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data: